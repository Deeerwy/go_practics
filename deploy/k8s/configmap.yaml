apiVersion: v1
kind: ConfigMap
metadata:
  name: tasks-config
data:
  # Порт, на котором слушает сервис
  TASKS_PORT: "8082"
  # Адрес сервиса авторизации (задаётся даже если auth не развёрнут в кластере —
  # демонстрирует механизм передачи конфигурации)
  AUTH_BASE_URL: "http://auth:8081"
  # Уровень логирования
  LOG_LEVEL: "info"
