syntax = "proto3";

package auth;

option go_package = "tech-ip-sem2/proto/authpb;authpb";

// AuthService описывает gRPC-контракт проверки токена.
service AuthService {
  rpc Verify(VerifyRequest) returns (VerifyResponse);
}

message VerifyRequest {
  string token = 1;
}

message VerifyResponse {
  bool valid = 1;
  string subject = 2;
}

